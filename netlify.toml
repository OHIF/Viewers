# Netlify Config
#
# TOML Reference:
# https://www.netlify.com/docs/netlify-toml-reference/

[build]
  base = ""
  # A `CS3D_REF:` line in the PR body selects the CS3D build of a deploy
  # preview, as it does for the Playwright workflow and CircleCI. Without the
  # line, or on a build that is not a deploy preview, the script changes nothing.
  # --after-build keeps a changed CS3D out of the Netlify build cache.
  command = "bash .scripts/ci/cs3d-apply-ref.sh && pnpm run build:ci && bash .scripts/ci/cs3d-apply-ref.sh --after-build"
  publish = "platform/app/dist"

[build.environment]
  NODE_ENV = "development"
  NODE_VERSION = "24.15.0"

# ─── Security Headers (Production) ───────────────────────────────────────────

[[headers]]
  for = "/*"

  [headers.values]
    # HTTPS enforcement
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # Clickjacking protection
    X-Frame-Options = "DENY"

    # MIME-type sniffing prevention
    X-Content-Type-Options = "nosniff"

    # Referrer policy — don't leak full URL (which might contain study UIDs)
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Disable legacy XSS auditor (modern browsers use CSP instead)
    X-XSS-Protection = "0"

    # Restrict browser features
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

    # Content Security Policy (enforcing)
    # - connect-src restricted to our own API domains only
    # - object-src blocked entirely
    # - frame-ancestors none (no embedding)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.imaging.smartcareplus.in; font-src 'self' data:; connect-src 'self' https://api.imaging.smartcareplus.in https://api.smartcareplus.in blob:; worker-src 'self' blob:; object-src 'none'; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

    # Prevent caching of HTML pages (which may embed study context)
    cache-control = '''
    max-age=0,
    no-cache,
    no-store,
    must-revalidate'''

# Static assets can be cached aggressively (hashed filenames)
[[headers]]
  for = "/static/*"

  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

# Block source maps from being indexed or cached
[[headers]]
  for = "/*.map"

  [headers.values]
    X-Robots-Tag = "noindex"
    cache-control = "no-store"
