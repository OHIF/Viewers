version: 1
frontend:
  phases:
    preBuild:
      commands:
        - export NODE_OPTIONS="--max-old-space-size=6144"
        - corepack enable
        - pnpm install --no-frozen-lockfile
    build:
      commands:
        - export NODE_OPTIONS="--max-old-space-size=6144"
        - export GENERATE_SOURCEMAP=false
        - chmod -R +x node_modules/.bin 2>/dev/null || true
        - APP_CONFIG=config/smartcareplus.js pnpm run build
  artifacts:
    baseDirectory: platform/app/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
