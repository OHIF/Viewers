name: Daily Dependency Check

# Weekday check of master's dependencies (or of any branch, run by hand). It
# builds the viewer to list the npm packages in dist, audits pnpm-lock.yaml,
# and writes a short public run summary: "Review immediately", "Review
# promptly", "Review soon" and "Ignored, update available", each row only an
# advisory link and a package name. The logic and the reasoning are in
# .scripts/dependency-audit/dist-packages.mjs and daily.mjs.
#
# Findings never fail the run. A check that can't do its job (build broken,
# no packages readable from the build's source maps or copy list, npm
# unreachable) fails and writes no summary.
#
# The workflow and the scripts always come from the default branch; only the
# lockfile, pnpm-workspace.yaml and the build come from the branch being
# checked (release branches don't have the scripts). The build runs that
# branch's code, so the token is read-only and never handed to a step.
#
# The build always uses the branch's rsbuild.config.ts. That matches the real
# production build only on branches built with rsbuild (master since
# 2026-09-17); on older branches whose production build is rspack's
# .webpack/webpack.pwa.js (e.g. release/3.13) the package list may differ
# from that branch's real production build, or the build may fail.

on:
  schedule:
    - cron: '20 10 * * 1-5' # weekdays, ~6:20am US Eastern
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to check
        required: true
        default: master
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch || github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  check:
    name: Daily dependency check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      BRANCH: ${{ inputs.branch || github.event.repository.default_branch }}
    steps:
      - name: Check out the check's scripts (default branch)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tools
          persist-credentials: false
          sparse-checkout: .scripts/dependency-audit
      - name: Check out the branch to check
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.BRANCH }}
          path: target
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: target/package.json
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
      - name: Install the branch's dependencies
        working-directory: target
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: pnpm install --frozen-lockfile
      - name: Install the check's dependency
        working-directory: tools/.scripts/dependency-audit
        run: npm ci --ignore-scripts --no-audit --no-fund
      # The wrapper config loads the branch's own rsbuild.config.ts, so it is
      # placed in the branch's checkout before the build.
      # Caution: the env and the rsbuild command mirror platform/app's
      # `build:viewer:ci` script (minus version:update). If that script changes
      # how the production build is made, update this step to match;
      # .scripts/dependency-audit/build-step.test.mjs fails until they match.
      - name: Build the viewer and list the packages in dist
        working-directory: target/platform/app
        env:
          NODE_ENV: production
          QUICK_BUILD: 'false'
          APP_CONFIG: config/netlify.js
          PUBLIC_URL: /
          NODE_OPTIONS: --max-old-space-size=12288
          AUDIT_RECORD: ${{ runner.temp }}/record.json
        run: |
          mkdir -p ../../.scripts/dependency-audit
          cp "$GITHUB_WORKSPACE/tools/.scripts/dependency-audit/rsbuild.audit.config.ts" ../../.scripts/dependency-audit/
          ../../node_modules/.bin/rsbuild build --config ../../.scripts/dependency-audit/rsbuild.audit.config.ts --config-loader jiti
          node "$GITHUB_WORKSPACE/tools/.scripts/dependency-audit/dist-packages.mjs" \
            --record "$AUDIT_RECORD" \
            --lockfile "$GITHUB_WORKSPACE/target/pnpm-lock.yaml" \
            --out "$RUNNER_TEMP/dist-packages.json"
      - name: Audit the lockfile and write the summary
        run: |
          node tools/.scripts/dependency-audit/daily.mjs \
            --lockfile target/pnpm-lock.yaml \
            --workspace target/pnpm-workspace.yaml \
            --dist-packages "$RUNNER_TEMP/dist-packages.json" \
            --label "$BRANCH"
