name: Playwright Tests
on:
  pull_request:
    branches: [master, release/*]
  workflow_dispatch:
    inputs:
      cs3d_ref:
        description: >-
          Leave empty to just run the test suite against the CS3D version this repo already pins.
          Give a CS3D branch (e.g. main, feat/foo) or version (e.g. 5.10.3, 5.x) to run the
          integration path against that instead. Branches resolve against
          cornerstonejs/cornerstone3D; forks cannot be named. On a pull request, add a line
          "CS3D_REF: <ref>" to the PR body instead of using this.
        required: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Metadata-only gate on a hosted VM. It deliberately does NOT check out the
  # repository: everything it decides must be derived from GitHub-supplied event
  # data and the API, never from code the pull request controls. That is also
  # why its logic is inline rather than a script under .scripts/ — running a
  # script from the PR's own checkout would let the PR rewrite its own gate.
  #
  # It answers three questions:
  #   proceed     — may this run reach the shared self-hosted "nashua" box?
  #   integration — is a CS3D ref requested, and if so which (validated)?
  #   approval    — must a named reviewer approve before the box is used?
  #
  # The protected-path list below is duplicated in .github/CODEOWNERS and must
  # be kept in sync by hand. Editing one without the other fails silently.
  #
  # This job is part of the workflow it protects: a fork PR can delete it, along
  # with the `needs:` and `if:` below, and dispatch straight to the box. What
  # stops that is a repository setting —
  # `actions/permissions/fork-pr-contributor-approval` set to
  # `all_external_contributors`, so a maintainer approves every fork PR run.
  # Relaxing it removes that barrier silently, so treat it as part of this file.
  #
  # This job's value is catching an approval given without full attention.
  # Anyone setting out to get past it deletes it instead. Other layers exist
  # outside this repository; this is not the last line of defence.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # list changed files, read the PR body
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      integration: ${{ steps.decide.outputs.integration }}
      approval: ${{ steps.decide.outputs.approval }}
      cs3d_ref: ${{ steps.decide.outputs.cs3d_ref }}
      cs3d_defer: ${{ steps.decide.outputs.cs3d_defer }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: decide
        name: Decide whether this PR may run on the self-hosted runner
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CS3D_REF_INPUT: ${{ github.event.inputs.cs3d_ref }}
          # Whether the PR branch lives in this repo. If it does, someone with
          # write access pushed it — a fact, unlike anything derivable from the
          # author's identity. Do NOT substitute
          # `github.event.pull_request.author_association`: it does not track
          # repo access in either direction — its MEMBER value only means
          # "member of the owning org" (no write implied), and a repo admin can
          # report CONTRIBUTOR. There is no reliable alternative from inside a
          # fork PR's run either: the authoritative collaborator-permission API
          # needs a token with push access, and fork PRs get a read-only one.
          IS_SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail

          # ── 1. May this run reach the box at all? ──────────────────────────
          # Fork PRs that modify CI-defining files are not dispatched to nashua;
          # they run once the change has been reviewed and merged. Same-repo PRs
          # always proceed — the branch lives in this repo, so someone with
          # write access pushed it.
          proceed=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')
            count=$(wc -l <<<"$files")

            ci_touched=false
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              case "$f" in
                # Workflows, and the scripts they exec on the box.
                .github/*|.scripts/*)
                  ci_touched=true ;;
                # The install surface. package.json declares `preinstall`, and
                # pnpm executes a root pnpmfile, so editing either runs code on
                # the box during `pnpm install`. The lockfile and workspace file
                # steer what gets installed and can undo the release-age
                # quarantine; .npmrc can repoint the registry. Most of these are
                # untracked today — that is the point: a fork can ADD one, and a
                # list of only existing files would not notice.
                package.json|pnpm-lock.yaml|pnpm-workspace.yaml|preinstall.js|.npmrc)
                  ci_touched=true ;;
                .pnpmfile.mjs|.pnpmfile.cjs|pnpmfile.mjs|pnpmfile.cjs)
                  ci_touched=true ;;
              esac
            done <<<"$files"
            # The list endpoint caps at 3000 files; past that we cannot see every
            # path, so treat the PR as CI-touching.
            if [ "$count" -ge 3000 ]; then ci_touched=true; fi

            if [ "$ci_touched" = true ] && [ "$IS_SAME_REPO" != "true" ]; then
              echo "::notice::Playwright deferred: this PR changes CI-defining files and comes from a fork. It will run on the self-hosted runner once the change is reviewed and merged."
              proceed=false
            fi
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"
          if [ "$proceed" != true ]; then
            echo "integration=false" >> "$GITHUB_OUTPUT"
            echo "approval=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── 2. Is a CS3D ref requested, and which? ─────────────────────────
          # A `CS3D_REF:` line in the PR body is the request; on a manual run the
          # workflow input is. Both are optional and absence means the same
          # thing: run the ordinary suite against the CS3D version this repo
          # already pins, with no clone, no version rewrite and no preview
          # deploy. There is deliberately no default ref — one would go stale
          # against the pinned version and silently downgrade it.
          #
          # The body is read live from the API rather than from the event
          # payload, because a re-run replays the original payload — a line
          # added after the PR was opened would otherwise be acted on while
          # escaping the approval below.
          raw=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            raw="${CS3D_REF_INPUT:-}"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            # Lines inside a fenced code block are skipped: a PR that documents
            # or discusses this syntax would otherwise have its own examples
            # parsed as a request. Take the WHOLE remainder of a matching line,
            # not just its first token — the first-token parse silently dropped
            # the rest, so `CS3D_REF: fix/x (released as 5.25.80)` read as an
            # annotation and behaved as a live branch directive. Taking the
            # whole line lets the grammar below reject that instead.
            raw=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body' | awk '
              /^[[:space:]]*(```|~~~)/ { fence = !fence; next }
              !fence && /^[[:space:]]*CS3D_REF:/ {
                sub(/^[[:space:]]*CS3D_REF:[[:space:]]*/, "")
                sub(/[[:space:]]+$/, "")
                print; exit
              }')
          fi
          raw="${raw#"${raw%%[![:space:]]*}"}"; raw="${raw%"${raw##*[![:space:]]}"}"

          if [ -z "$raw" ]; then
            echo "No CS3D ref requested; running the ordinary Playwright suite."
            echo "integration=false" >> "$GITHUB_OUTPUT"
            echo "approval=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Three accepted forms:
          #   <branch>                     a branch or tag in cornerstonejs/cornerstone3D
          #   <version>                    a published version, e.g. 5.10.3, 5.x
          #   <branch> now <version>       the branch, and what it was released as
          #
          # The third is the retiring form: once the cornerstone3D fix ships, the
          # author changes the line rather than deleting it, and the branch name
          # stays visible as the reason the pinned version moved. Its version is a
          # RECORD, not a request — `cs3d_defer` tells the version step to keep
          # whatever the repo already pins when that is the same or newer, so a
          # stale note can never drag the pin backwards.
          #
          # Anything explicit is obeyed as given: a bare ref in the body, or
          # anything typed into the workflow_dispatch box. A `now` form typed
          # into that box parses the same way but does not defer — there is no
          # stored line there to go stale, so it is a direct request like any
          # other.
          history=""
          defer=false
          if [[ "$raw" =~ ^(.*[^[:space:]])[[:space:]]+now[[:space:]]+([^[:space:]]+)$ ]]; then
            history="${BASH_REMATCH[1]}"
            ref="${BASH_REMATCH[2]}"
            if [ "$EVENT_NAME" = "pull_request" ]; then defer=true; fi
          else
            ref="$raw"
          fi

          # ── 3. Validate the ref before it goes anywhere ────────────────────
          # On a fork PR this value is written by someone outside the project:
          # it is read out of the PR body and later steps put it into a git
          # clone and into log lines. Validate it against a conservative git-ref
          # grammar here, off the box, before it is published as a job output.
          #
          # The grammar bars whitespace and newlines (which would let the value
          # append extra entries to GITHUB_OUTPUT, a key=value file), a leading
          # '-' or '.' (which would make it look like a flag), and '..' (a ref
          # path escape). It deliberately does NOT permit ':' — a ref no longer
          # names a repository, only a branch or tag within
          # cornerstonejs/cornerstone3D.
          #
          # Fails loudly rather than falling back to the default, and quotes what
          # it read, because without that a rejection is undiagnosable — the
          # author cannot tell a typo from a line picked up somewhere they did
          # not expect. The value came from the PR body, which anyone can
          # already read, so quoting it discloses nothing; newlines and control
          # characters are stripped and the length capped so it cannot be read
          # as a workflow command of its own.
          ok=true
          if [[ ! "$ref" =~ ^[A-Za-z0-9][A-Za-z0-9._/+-]*$ ]] || [[ "$ref" == *..* ]]; then ok=false; fi
          if [ -n "$history" ]; then
            if [[ ! "$history" =~ ^[A-Za-z0-9][A-Za-z0-9._/+-]*$ ]] || [[ "$history" == *..* ]]; then ok=false; fi
          fi
          if [ "$ok" != true ]; then
            shown=$(printf '%s' "$raw" | tr -d '\000-\037' | cut -c1-200)
            echo "::error::Rejected the requested CS3D ref, read as: [${shown}]. Write it as one of: <branch>, <version>, or '<branch> now <version>'. Each part must start with a letter or digit, contain only letters, digits and the characters . _ / + - and contain no '..'. Forks cannot be named: give a branch or tag in cornerstonejs/cornerstone3D, or a published version."
            exit 1
          fi

          # The grammar above constrains which characters may appear; git also
          # constrains the shape. A trailing slash, a double slash, a path
          # component starting with a dot, and a '.lock' suffix all pass the
          # grammar and are still illegal refs. Without this, such a value
          # reaches the clone step and fails there with a git error, several
          # steps away from the typo that caused it. Every accepted version form
          # (4.19+, 4.x, 5.11.0-beta.1) is also a legal ref name, so one rule
          # covers both kinds of value.
          #
          # `refs/heads/$x` rather than `--branch $x`: the latter also expands
          # git's previous-branch syntax (@{-1}), which consults repository
          # state. The grammar already bars '@', so that cannot arise here, but a
          # validator that only validates is the simpler thing to reason about —
          # and this form needs no repository, which matters because this job
          # deliberately has no checkout.
          for part in "$ref" $history; do
            if ! git check-ref-format "refs/heads/${part}"; then
              echo "::error::Rejected the requested CS3D ref: git does not accept that ref name. Check for a trailing or doubled '/', a path component starting with '.', or a '.lock' suffix."
              exit 1
            fi
          done

          if [ -n "$history" ]; then
            echo "::notice::CS3D ref: ${ref} (was branch ${history})"
          else
            echo "::notice::CS3D ref requested: ${ref}"
          fi
          echo "integration=true" >> "$GITHUB_OUTPUT"
          echo "cs3d_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "cs3d_defer=$defer" >> "$GITHUB_OUTPUT"

          # ── 4. Does it need a named reviewer's approval? ───────────────────
          # An integration run clones and builds a CS3D branch on the shared box.
          # From a fork that is a request, not a decision, so it waits for one of
          # the reviewers on the `cs3d-integration` environment. A same-repo PR
          # or a manual run was already started by someone with write access, so
          # it proceeds unattended.
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$IS_SAME_REPO" != "true" ]; then
            echo "::notice::This fork PR requests a CS3D integration run, so it needs approval from a reviewer on the cs3d-integration environment before it reaches the self-hosted runner."
            echo "approval=true" >> "$GITHUB_OUTPUT"
          else
            echo "approval=false" >> "$GITHUB_OUTPUT"
          fi

  playwright-tests:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    timeout-minutes: 120
    # `cs3d-integration` carries required reviewers, so naming it makes the job
    # wait for an approval that shows up on the pull request itself.
    # `unrestricted` carries no protection rules and is the ordinary path. The
    # choice comes from the gate rather than from the event payload — see the
    # note on reading the PR body live, above.
    environment:
      ${{ needs.gate.outputs.approval == 'true' && 'cs3d-integration' || 'unrestricted' }}
    runs-on: [self-hosted, nashua]
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.15.0]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          # No `cache: pnpm`: this is a self-hosted runner with a persistent
          # pnpm store on local disk. The Actions cache doesn't preserve the
          # pnpm self-install's links faithfully, dropping pnpm/dist/worker.js
          # and breaking `pnpm install` with MODULE_NOT_FOUND.
      # Install pnpm via Corepack instead of pnpm/action-setup. The action's
      # self-installer is a JS action run under the runner's bundled
      # externals/node{version} and derives the `npm` path from that runtime — which
      # on this self-hosted runner is corrupted (Cannot find module
      # '../lib/cli.js'), so it dies regardless of `standalone:true`. Corepack
      # ships inside the Node that setup-node just installed, reads the pinned
      # `packageManager` (pnpm@11.5.2) from package.json, and fetches pnpm via
      # Node's own https — it never invokes the npm CLI.
      - name: Enable Corepack (pnpm)
        shell: bash
        run: |
          corepack enable
          corepack prepare --activate

      # ── CS3D integration: detect ref type ────────────────────────────────
      # The ref itself was parsed and validated by the gate, off the box. This
      # step only classifies it, because resolving a version range needs a
      # checkout of .scripts/ and the gate has none by design.
      - name: Detect CS3D ref type
        id: cs3d-ref
        if: needs.gate.outputs.integration == 'true'
        run: |
          if [[ "$CS3D_REF" =~ ^[0-9]+\.[0-9x]+\+?(\.[0-9x]+)?(-[a-zA-Z0-9._]+)?$ ]]; then
            echo "type=version" >> "$GITHUB_OUTPUT"
            RESOLVED=$(node .scripts/cs3d-resolve-version.mjs "$CS3D_REF")
            echo "version=$RESOLVED" >> "$GITHUB_OUTPUT"
            echo "::notice::CS3D version: $CS3D_REF -> $RESOLVED"
          else
            echo "type=branch" >> "$GITHUB_OUTPUT"
            echo "::notice::CS3D branch: $CS3D_REF"
          fi
        env:
          CS3D_REF: ${{ needs.gate.outputs.cs3d_ref }}

      # ── CS3D branch path: clone and build before OHIF install ───────────
      # The repository is fixed. A ref names a branch or tag in
      # cornerstonejs/cornerstone3D and nothing else — it previously accepted an
      # `owner:branch` form, which let a pull request point this clone at any
      # GitHub account's fork and then run its install scripts and build on the
      # shared self-hosted box.
      #
      # $CS3D_REF is read as a shell variable, never interpolated as ${{ }}:
      # GitHub pastes ${{ }} in as literal text before the shell parses the
      # command, so punctuation in the value would become program structure. The
      # shell expands an env var only after parsing, so it can only ever be an
      # argument.
      - name: Clone CS3D
        if: needs.gate.outputs.integration == 'true' && steps.cs3d-ref.outputs.type == 'branch'
        run: |
          echo "::notice::Cloning cornerstonejs/cornerstone3D branch $CS3D_REF"
          git clone --depth 1 --branch "$CS3D_REF" \
            https://github.com/cornerstonejs/cornerstone3D.git libs/@cornerstonejs
        env:
          CS3D_REF: ${{ needs.gate.outputs.cs3d_ref }}

      - name: Install & Build CS3D
        if: needs.gate.outputs.integration == 'true' && steps.cs3d-ref.outputs.type == 'branch'
        working-directory: libs/@cornerstonejs
        run: pnpm install --frozen-lockfile && pnpm run build:esm

      # ── Common: install OHIF dependencies ───────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── CS3D branch path: link packages after OHIF install ──────────────
      - name: Link CS3D packages
        if: needs.gate.outputs.integration == 'true' && steps.cs3d-ref.outputs.type == 'branch'
        working-directory: libs/@cornerstonejs
        run: node scripts/link-ohif-cornerstone-node-modules.mjs "$GITHUB_WORKSPACE"

      # ── CS3D version path: update versions after OHIF install ───────────
      # Split into two steps on purpose. Rewriting the manifests puts them out of
      # step with the lockfile, so the reinstall cannot be frozen — but that only
      # applies if something was actually rewritten. When the repo already pins
      # the requested version (or, for a `now` clause, something newer), nothing
      # changes and the frozen install from "Install dependencies" above already
      # describes the tree under test. Reinstalling then would replace a faithful
      # tree with a re-resolved one, which is the opposite of what an integration
      # run is for.
      - name: Set CS3D version
        id: set-version
        if: needs.gate.outputs.integration == 'true' && steps.cs3d-ref.outputs.type == 'version'
        run: |
          if [ "$CS3D_DEFER" = "true" ]; then
            node .scripts/cs3d-set-version.mjs "$CS3D_VERSION" --only-if-newer
          else
            node .scripts/cs3d-set-version.mjs "$CS3D_VERSION"
          fi
        env:
          CS3D_VERSION: ${{ steps.cs3d-ref.outputs.version }}
          CS3D_DEFER: ${{ needs.gate.outputs.cs3d_defer }}

      - name: Reinstall after the version change
        if: steps.set-version.outputs.changed == 'true'
        run: pnpm install --no-frozen-lockfile

      # ── Common: run tests ───────────────────────────────────────────────
      - name: Install Playwright browsers
        # Only chromium is used (see playwright.config.ts and tests/globalSetup.ts);
        # firefox/webkit projects are commented out. Scoping the install to chromium
        # avoids downloading + dep-validating browsers we never launch (the WebKit
        # validation is what surfaces the "missing libwoff1/libflite1/..." error on
        # hosts without those libs).
        #
        # `pnpm exec`, not `npx`: this runs the playwright the lockfile pins,
        # rather than whatever the registry serves at that moment.
        run: pnpm exec playwright install chromium
      - name: Run Playwright tests
        run: |
          export NODE_OPTIONS="--max_old_space_size=10192"
          bash .scripts/ci/with-nashua-lock.sh pnpm run test:e2e:coverage

      # ── Common: collect test results and coverage ───────────────────────
      - name: Create directory of test results
        if: ${{ !cancelled() }}
        run: |
          mkdir -p packaged-test-results
          cp -r ./tests/test-results packaged-test-results/ || true
          cp -r ./tests/playwright-report packaged-test-results/ || true
      - name: Upload directory of test results artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: packaged-test-results/
          retention-days: 5
      - name: create the coverage report
        run: |
          pnpm exec nyc report --reporter=lcov --reporter=text
      - name: Upload the coverage report to GitHub Actions Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-pr
          path: coverage
          retention-days: 3

      # ── CS3D: build and deploy preview to Netlify ───────────────────────
      - name: Log build context (OHIF/CS3D branch and version for build diagnosis)
        if: needs.gate.outputs.integration == 'true'
        run: |
          if [[ "$CS3D_REF_TYPE" == "branch" ]]; then
            echo "::notice::Build type: ohif-downstream | OHIF: ${{ github.repository }}@${{ github.ref }} (${{ github.sha }}) | CS3D: branch ${CS3D_REF}"
          else
            echo "::notice::Build type: ohif-upstream | OHIF: ${{ github.repository }}@${{ github.ref }} (${{ github.sha }}) | CS3D: version ${CS3D_VERSION}"
          fi
          node .scripts/log-build-context.mjs
        env:
          BUILD_TYPE:
            ${{ steps.cs3d-ref.outputs.type == 'branch' && 'ohif-downstream' || 'ohif-upstream' }}
          CS3D_REF_TYPE: ${{ steps.cs3d-ref.outputs.type }}
          CS3D_REF: ${{ needs.gate.outputs.cs3d_ref }}
          CS3D_VERSION: ${{ steps.cs3d-ref.outputs.version }}

      - name: Build OHIF viewer (CS3D preview)
        if: needs.gate.outputs.integration == 'true'
        run: pnpm run build:ci

      - name: Deploy CS3D preview to Netlify
        if: needs.gate.outputs.integration == 'true'
        # The version is pinned here rather than in package.json. This ran
        # `npx netlify-cli`, which fetched whatever the registry served at that
        # moment and ran it on the self-hosted box with NETLIFY_AUTH_TOKEN in
        # its environment.
        #
        # `--package` is required: its binaries are `netlify` and `ntl`, neither
        # matching the package name, so pnpm cannot pick a default.
        run: |
          RESULT=$(pnpm dlx --package=netlify-cli@27.5.2 netlify deploy --dir=platform/app/dist --alias="cs3d-pr-${PR_NUM}" --json --filter=@ohif/app) || {
            echo "::error::Netlify deploy command failed"
            exit 1
          }
          URL=$(echo "$RESULT" | jq -r '.deploy_url')
          if [[ -z "$URL" || "$URL" == "null" ]]; then
            echo "::error::Netlify deploy did not return a valid URL"
            echo "$RESULT"
            exit 1
          fi
          echo "::notice::CS3D preview deployed: $URL"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          PR_NUM: ${{ github.event.pull_request.number || 'manual' }}

      # ── CS3D: log results ───────────────────────────────────────────────
      - name: Log CS3D build used
        if: needs.gate.outputs.integration == 'true'
        run: |
          if [[ "$CS3D_REF_TYPE" == "branch" ]]; then
            echo "::notice::CS3D integration PASSED with branch ${CS3D_REF} (linked from libs/@cornerstonejs)"
          else
            echo "::notice::CS3D integration PASSED with @cornerstonejs/*@${CS3D_VERSION}"
          fi
        env:
          CS3D_REF_TYPE: ${{ steps.cs3d-ref.outputs.type }}
          CS3D_REF: ${{ needs.gate.outputs.cs3d_ref }}
          CS3D_VERSION: ${{ steps.cs3d-ref.outputs.version }}

  # ── Separate job: flag a merge that would depend on unreleased CS3D ──
  # Advisory, deliberately: it reports, it does not block. `master` requires no
  # status checks, so a red result here leaves the merge button enabled — and
  # the script it runs comes from the pull request's own checkout, so a fork
  # could neuter it. CODEOWNERS covers the second of those; making this a
  # required status check would cover the first, but that changes how every PR
  # in the repo merges and is not this workflow's decision to make.
  cs3d-branch-merge-guard:
    name: 'CS3D Branch Merge Guard'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Check for CS3D branch usage
        run: bash .scripts/ci/cs3d-branch-merge-guard.sh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
